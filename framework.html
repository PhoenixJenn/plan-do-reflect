<!-- Applied before CSS loads, so the saved theme / title-font choice doesn't flash to the default on reload -->
<script>
(function () {
  try {
    var savedTheme = localStorage.getItem('pdr-theme');
    if (['a', 'b', 'c'].indexOf(savedTheme) > -1) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
    var savedTitleFont = localStorage.getItem('pdr-title-font');
    var titleFont = savedTitleFont === null ? 'golos-text' : savedTitleFont;
    if (titleFont !== 'default') {
      document.documentElement.setAttribute('data-title-font', titleFont);
    }
  } catch (e) {}
})();
</script>
